# TickForge database vs MySQL, same workload. Separate from storage/ so that the
# MySQL client never becomes a dependency of the database or of `./build.sh test`.
# Run it with `./build.sh bench-mysql`.
[package]
name = "mysql_baseline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tickforge_db = { path = "../../storage" }
mysql = { version = "28", default-features = false, features = ["minimal"] }

[profile.release]
debug = false

[workspace]
